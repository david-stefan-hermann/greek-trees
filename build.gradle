plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.0-alpha.7'
    id 'me.modmuss50.mod-publish-plugin' version '1.0.0'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    // bcf-guide-book-lib: `./gradlew publishToMavenLocal` in ../bcf-guide-book-lib
    mavenLocal {
        content {
            includeGroup 'de.baconcakefactory'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // The guide book's screen (bundled as a nested jar).
    implementation "de.baconcakefactory:bcf-guide-book-lib:${project.guide_book_version}"
    include "de.baconcakefactory:bcf-guide-book-lib:${project.guide_book_version}"
}

// `./gradlew runServer -PselfTest`: the dev server grows every sapling a number of times on platforms high above
// spawn, lets vanilla recompute and decay the leaves, writes run/greektrees-selftest/ and shuts down
// (see greektrees.DevSelfTest). The server saves its world on the way out, so every test starts from a new one:
// the trees of the last run would stand in the way.
if (project.hasProperty('selfTest')) {
    loom {
        runs {
            server {
                vmArg "-Dgreektrees.selftest=${project.hasProperty('selfTestCount') ? project.selfTestCount : 12}"
            }
        }
    }
    tasks.named('runServer') {
        doFirst {
            delete file('run/world')
        }
    }
}

// `./gradlew runServer -Pdrafts=p1,w1`: writes the draft rounds of greektrees.tree.Drafts to run/greektrees-drafts/
// and exits (see PLAN-PALME-WEIDE.md); `cd concept && python render_selftest.py drafts p1 w1` draws them.
if (project.hasProperty('drafts')) {
    loom {
        runs {
            server {
                vmArg "-Dgreektrees.drafts=${project.drafts}"
            }
        }
    }
}

// `./gradlew runClient -PbookShots`: the dev client joins the world run/saves/bookshots (a copy of run/world will
// do; item stacks need a world's registries, the title screen has none), opens every page of the guide book, saves
// run/screenshots/book_greektrees_<language>_<nr>.png and quits (see GuideBookClient in bcf-guide-book-lib). The
// language and GUI scale come from run/options.txt (lang:de_de, guiScale:2; pauseOnLostFocus:false keeps the pause
// menu away); 1280 x 720 is GUI scale 3 on auto. `-PbookShots=greektrees,<modid>` also goes through the books of
// other mods dropped into run/mods.
if (project.hasProperty('bookShots')) {
    loom {
        runs {
            client {
                vmArg "-Dbcf.guidebook.shots=${project.bookShots ?: 'greektrees'}"
                programArgs "--quickPlaySingleplayer", "bookshots"
                programArgs "--width", "1280", "--height", project.hasProperty('bookShotsHeight') ? project.bookShotsHeight : "720"
            }
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

base {
    archivesName = project.archives_base_name
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// `./gradlew publishMods` uploads build/libs/<jar> to CurseForge. Token and project id live in
// ~/.gradle/gradle.properties (gt.curseforge.token / gt.curseforge.projectId), never in the repository.
// Without a project id nothing is uploaded. The changelog is the top section of CHANGELOG.md.
publishMods {
    file = tasks.named('jar').flatMap { it.archiveFile }
    changelog = provider { topChangelogSection() }
    type = STABLE
    displayName = "Greek Trees ${project.version}"
    version = project.version.toString()
    modLoaders.add("fabric")

    if (project.hasProperty('gt.curseforge.projectId')) {
        curseforge {
            accessToken = providers.gradleProperty("gt.curseforge.token")
            projectId = providers.gradleProperty("gt.curseforge.projectId")
            minecraftVersions.add(project.minecraft_version)
            javaVersions.add(JavaVersion.VERSION_25)
            clientRequired = true
            serverRequired = true
            requires("fabric-api")
        }
    }
}

/** First "## " section of CHANGELOG.md, without its heading. */
String topChangelogSection() {
    def lines = file("CHANGELOG.md").readLines()
    def out = []
    boolean inSection = false
    for (line in lines) {
        if (line.startsWith("## ")) {
            if (inSection) break
            inSection = true
            continue
        }
        if (inSection) out << line
    }
    return out.join("\n").trim()
}
